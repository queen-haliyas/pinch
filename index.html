<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D97757">
<meta name="description" content="Scale any recipe to any number of people. Vegan versions, cook mode, weekly planner, pantry finder and unit converter.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script>try{var t=localStorage.getItem('ss:theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Scale &amp; Simmer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, orange stripe band on top, bottom tab bar, big serving dial as the single bold moment. Palette: Claude orange, warm cream, charcoal, with a soft sky blue second accent. */
:root {
  --bg: #FAF9F5;
  --surface: #FFFFFF;
  --surface-2: #F0EEE6;
  --ink: #141413;
  --ink-2: #5E5D59;
  --line: #E8E6DC;
  --brand: #D97757;
  --on-brand: #141413;
  --blue: #B5532F;
  --blue-soft: #F8E9E1;
  --butter: #6A9BCC;
  --on-butter: #141413;
  --ok: #5C7040;
  --warn: #A9500A;
  --danger: #B3261E;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --surface: #1F1E1D; --surface-2: #2A2927; --ink: #FAF9F5; --ink-2: #B0AEA5;
    --line: #3A3835; --brand: #D97757; --on-brand: #141413; --blue: #E8906E; --blue-soft: #3A2A22;
    --butter: #6A9BCC; --on-butter: #141413; --ok: #A3B88A; --warn: #F0A25A; --danger: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --surface: #1F1E1D; --surface-2: #2A2927; --ink: #FAF9F5; --ink-2: #B0AEA5;
  --line: #3A3835; --brand: #D97757; --on-brand: #141413; --blue: #E8906E; --blue-soft: #3A2A22;
  --butter: #6A9BCC; --on-butter: #141413; --ok: #A3B88A; --warn: #F0A25A; --danger: #FF8A80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  padding-inline: 16px; padding-block: 0 96px;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.1; letter-spacing: -0.01em; }
h2 { font-size: 26px; font-weight: 800; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
a { color: var(--blue); }
.wrap { max-width: 760px; margin-inline: auto; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--ink-2); }

/* top band */
.band { height: 14px; margin-inline: -16px;
  background: repeating-linear-gradient(90deg, var(--brand) 0 12px, var(--surface) 12px 24px); }
.masthead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 6px; }
.brand { font: 800 24px/1 var(--font-display); letter-spacing: -0.02em; }
.brand span { color: var(--blue); }

/* views */
.view { display: none; padding-block: 14px 8px; }
.view.on { display: block; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 0; min-width: 0; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; min-height: 42px; }
.btn:hover { border-color: var(--blue); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.butter { background: var(--butter); border-color: var(--butter); color: var(--on-butter); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--blue); padding-inline: 6px; }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; min-height: 34px; }
.chip.on { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); }

/* inputs */
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
input[type=text], input[type=number], input[type=search], input[type=password], select, textarea {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 42px; width: 100%; color: var(--ink); font-weight: 400;
}
textarea { min-height: 96px; resize: vertical; }
input.bad, select.bad { border-color: var(--danger); }
.err { color: var(--danger); font-size: 13px; font-weight: 600; }
.hint { color: var(--ink-2); font-size: 13px; }

/* recipe grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; min-width: 0; }
button.card:hover { border-color: var(--blue); }
.card h3 { overflow-wrap: anywhere; }
.card .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 22px 16px; text-align: center; color: var(--ink-2); }

/* the serving dial */
.dial { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.dial-main { display: flex; align-items: center; justify-content: center; gap: 14px; }
.step { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--blue); background: transparent; color: var(--blue); font: 700 28px/1 var(--font-display); }
.step:hover { background: var(--blue-soft); }
input.big { font: 800 76px/1 var(--font-display); letter-spacing: -0.04em; min-width: 2ch; text-align: center; background: var(--brand); color: var(--on-brand); border-radius: 16px; padding: 4px 16px 8px; border: 0; width: auto; min-height: 0; max-width: 40vw; }
input.big::-webkit-inner-spin-button, input.big::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input.big { -moz-appearance: textfield; appearance: textfield; }
.dial-cap { text-align: center; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 8px 12px; font-weight: 600; font-size: 13px; min-height: 40px; }
.seg button.on { background: var(--brand); color: var(--on-brand); }
.switch { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; }
.switch input { width: 20px; height: 20px; min-height: 0; accent-color: var(--blue); }

/* ingredients */
.ing { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; }
.ing li { display: grid; grid-template-columns: minmax(84px, 112px) 1fr; gap: 4px 14px; padding: 11px 14px; border-top: 1px solid var(--line); align-items: baseline; }
.ing li:first-child { border-top: 0; }
.ing .q { font: 500 16px/1.3 var(--font-mono); color: var(--blue); white-space: nowrap; }
.ing .n { overflow-wrap: anywhere; }
.ing .work { grid-column: 2; font: 400 12px/1.4 var(--font-mono); color: var(--ink-2); overflow-wrap: anywhere; }
.ing .tip { grid-column: 2; font-size: 12px; color: var(--warn); font-weight: 600; }
.steps { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.steps li::before { content: counter(s); font: 700 14px/30px var(--font-display); width: 30px; height: 30px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); text-align: center; }
.callout { background: var(--blue-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.callout.warn { background: var(--surface-2); border-left: 4px solid var(--brand); }

/* add form */
.irow { display: grid; grid-template-columns: 76px 92px 1fr 40px; gap: 8px; align-items: start; }
.irow .x { min-height: 42px; border: 1.5px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink-2); font-size: 18px; }
@media (max-width: 480px) { .irow { grid-template-columns: 64px 80px 1fr 38px; gap: 6px; } }

/* snap */
.drop { border: 2px dashed var(--blue); border-radius: 16px; padding: 18px; text-align: center; background: var(--blue-soft); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.preview { max-width: 100%; max-height: 260px; border-radius: 12px; object-fit: cover; }

/* learn */
details.tech { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 0; }
details.tech summary { padding: 14px; font: 700 17px/1.2 var(--font-display); cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
details.tech summary::-webkit-details-marker { display: none; }
details.tech summary::after { content: "+"; font-size: 22px; color: var(--blue); }
details.tech[open] summary::after { content: "−"; }
details.tech .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }

/* converter */
.work-box { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
.result { font: 800 40px/1.1 var(--font-display); color: var(--blue); overflow-wrap: anywhere; }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--ink-2); font-weight: 600; }

/* nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1.5px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.nav-in { max-width: 760px; margin-inline: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.nav button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); border-radius: 10px; min-height: 52px; }
.nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button.on { color: var(--blue); background: var(--blue-soft); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 9; max-width: calc(100% - 32px); }
.spin { display: inline-block; width: 16px; height: 16px; border: 2.5px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -3px; margin-right: 8px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
@media (max-width: 400px) { input.big { font-size: 64px; } .step { width: 46px; height: 46px; } }

/* extras, cook mode, plan, pantry */
details.x { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; }
details.x > summary { padding: 13px 14px; font: 700 16px/1.2 var(--font-display); cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
details.x > summary::-webkit-details-marker { display: none; }
details.x > summary::after { content: "+"; font-size: 22px; color: var(--blue); }
details.x[open] > summary::after { content: "−"; }
details.x > .xb { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.kcal { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kcal b { font: 800 40px/1 var(--font-display); color: var(--blue); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag.warn { background: var(--butter); color: var(--on-butter); }
.tag.ok { background: var(--surface-2); color: var(--ink-2); }
.price-row { display: grid; grid-template-columns: 1fr 84px 96px; gap: 8px; align-items: center; padding-block: 4px; border-top: 1px solid var(--line); }
.price-row:first-child { border-top: 0; }
.price-row .pn { min-width: 0; overflow-wrap: anywhere; }
.price-row input, .price-row select { min-height: 38px; padding: 6px 8px; }
.sum { background: var(--blue-soft); border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.sum b { font: 800 26px/1.1 var(--font-display); color: var(--blue); }
.cook { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.cook-in { max-width: 760px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
.cook-step { font: 600 28px/1.35 var(--font-body); text-wrap: pretty; }
@media (min-width: 600px) { .cook-step { font-size: 34px; } }
.prog { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--brand); }
.timer { display: flex; align-items: center; gap: 10px; justify-content: space-between; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.timer.done { background: var(--butter); color: var(--on-butter); border-color: var(--butter); }
.timer .t { font: 500 26px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.cook-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
.cook-nav .btn { min-height: 56px; font-size: 17px; }
.day { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.meal { display: grid; grid-template-columns: 1fr 70px 40px; gap: 8px; align-items: center; }
.meal input { min-height: 38px; padding: 6px 8px; }
.pantry-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip.rm::after { content: " ×"; }
.check { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding-block: 7px; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; }
.check input { width: 20px; height: 20px; min-height: 0; accent-color: var(--brand); }
.check.got .cn { text-decoration: line-through; color: var(--ink-2); }
.check .cq { font: 500 14px/1.2 var(--font-mono); color: var(--blue); white-space: nowrap; }
.nav-in { grid-template-columns: repeat(6, 1fr) !important; }
.nav button { font-size: 11px !important; padding-inline: 2px !important; }

/* floating nav */
.nav { left: 12px !important; right: 12px !important; bottom: calc(12px + env(safe-area-inset-bottom, 0px)) !important; padding: 6px !important; border: 1.5px solid var(--line) !important; border-radius: 26px; box-shadow: 0 8px 28px rgba(20,20,19,.18), 0 2px 6px rgba(20,20,19,.08); max-width: 560px; margin-inline: auto; }
.nav button { border-radius: 20px !important; min-height: 50px !important; }
main { padding-bottom: 110px; }
.toast { bottom: calc(100px + env(safe-area-inset-bottom, 0px)) !important; }

/* search home */
.search { position: relative; }
input.hero { min-height: 56px; font-size: 18px; padding: 12px 16px; border-radius: 16px; border: 2px solid var(--brand); width: 100%; }
.sugg { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 8; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; box-shadow: 0 12px 32px rgba(20,20,19,.18); max-height: 60vh; overflow-y: auto; padding: 6px; }
.sg { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; min-height: 48px; justify-content: center; }
.sg:hover, .sg.on { background: var(--blue-soft); }
.sg .sgn { font-weight: 700; font-size: 16px; }
.sg .sgm { font-size: 12px; color: var(--ink-2); }
.sg.all { color: var(--blue); font-weight: 700; }
.sg.none { color: var(--ink-2); }
.sg mark { background: var(--butter); color: var(--on-butter); border-radius: 3px; padding: 0 1px; }

/* web app additions */
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-size: 18px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.iconbtn:hover { border-color: var(--blue); }
fieldset.tinbox { border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 12px 12px; margin: 0; min-width: 0; }
fieldset.tinbox legend { padding: 0 6px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
dialog.dlg { border: 1.5px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); padding: 18px; width: min(520px, calc(100% - 24px)); max-height: 86vh; overflow: auto; }
dialog.dlg::backdrop { background: rgba(20, 20, 19, .55); }
.dlg pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); padding: 10px; border-radius: 10px; max-height: 28vh; overflow: auto; font: 13px/1.45 var(--font-mono); margin: 0; }
.dlg input[type=text] { width: 100%; }
.dlg-actions { display: flex; flex-wrap: wrap; gap: 8px; }
#count { white-space: nowrap; }
.masthead .brand { font-size: 22px; white-space: nowrap; }
fieldset.tinbox .row { flex-wrap: nowrap; align-items: center; gap: 8px; }
fieldset.tinbox select { width: auto; flex: 1 1 0; min-width: 0; }
fieldset.tinbox select[data-f="unit"] { flex: 0 0 74px; }
fieldset.tinbox input { flex: 0 0 76px; }
</style>
</head><body>
<div class="band" aria-hidden="true"></div>
<div class="wrap">
  <header class="masthead">
    <div class="brand">Scale <span>&amp;</span> Simmer</div>
    <div class="row" style="gap:8px;flex-wrap:nowrap"><span class="tag" id="count"></span>
      <button type="button" class="iconbtn" id="theme-btn" data-w="theme" aria-label="Switch theme">☾</button>
      <button type="button" class="iconbtn" data-w="settings" aria-label="Settings">⚙</button></div>
  </header>
  <main>
    <section class="view on" id="v-recipes" aria-label="Recipes"></section>
    <section class="view" id="v-recipe" aria-label="Recipe"></section>
    <section class="view" id="v-add" aria-label="Add a recipe"></section>
    <section class="view" id="v-pantry" aria-label="Pantry"></section>
    <section class="view" id="v-plan" aria-label="Plan"></section>
    <section class="view" id="v-snap" aria-label="Photo to recipe"></section>
    <section class="view" id="v-learn" aria-label="Learn"></section>
    <section class="view" id="v-convert" aria-label="Converter"></section>
    <section class="view" id="v-settings" aria-label="Settings"></section>
  </main>
</div>
<nav class="nav" aria-label="Main">
  <div class="nav-in">
    <button type="button" data-tab="recipes" class="on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M9 8h7"/></svg>Recipes</button>
    <button type="button" data-tab="pantry">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v3H7zM6 6h12v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z"/><path d="M9 11h6M9 15h6"/></svg>Pantry</button>
    <button type="button" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
    <button type="button" data-tab="snap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Snap</button>
    <button type="button" data-tab="learn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>Learn</button>
    <button type="button" data-tab="convert">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h14M17 12l4 4-4 4M21 16H7"/></svg>Convert</button>

}

/* ----- Gemini (your own free key, kept only in this browser) ----- */
const GEM_KEY = 'ss:gemini', GEM_MODEL = 'gemini-flash-latest';
function gemCfg() {
  try { const o = JSON.parse(localStorage.getItem(GEM_KEY) || 'null') || {}; return { key: String(o.key || '').trim(), model: String(o.model || '').trim() || GEM_MODEL }; }
  catch (e) { return { key: '', model: GEM_MODEL }; }
}
function gemSave(c) { try { localStorage.setItem(GEM_KEY, JSON.stringify(c)); } catch (e) {} }

const gemErr = (code, detail) => Object.assign(new Error(detail || code), { code, detail });
function mkShim(cfg) {
  return {
    async json(prompt, opts = {}) {
      if (!cfg.key) throw gemErr('no_key');
      const parts = [{ text: prompt }];
      for (const im of (opts.images || [])) parts.push({ inline_data: { mime_type: im.type || 'image/jpeg', data: await blobB64(im) } });
      let resp;
      try {
        resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(cfg.model) + ':generateContent', {
          method: 'POST', signal: opts.signal,
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': cfg.key },
          body: JSON.stringify({ contents: [{ role: 'user', parts }], generationConfig: { responseMimeType: 'application/json', temperature: 0.4 } })
        });
      } catch (e) { throw gemErr(e && e.name === 'AbortError' ? 'cancelled' : 'network'); }
      let data = null; try { data = await resp.json(); } catch (e) {}
      if (!resp.ok) {
        const msg = (data && data.error && data.error.message) || '', st = resp.status;
        throw gemErr(st === 429 ? 'rate_limited' : (st === 400 && /api key/i.test(msg)) || st === 401 || st === 403 ? 'bad_key' : st === 404 ? 'model' : 'api', msg || 'HTTP ' + st);
      }
      const cand = data && data.candidates && data.candidates[0];
      const txt = cand && cand.content && cand.content.parts ? cand.content.parts.map(p => p.text || '').join('') : '';
      if (!txt) throw gemErr(data && data.promptFeedback && data.promptFeedback.blockReason ? 'refused' : 'empty_completion');
      try { return JSON.parse(txt); } catch (e) {
        const m = txt.match(/\{[\s\S]*\}/);
        if (m) { try { return JSON.parse(m[0]); } catch (x) {} }
        throw gemErr('invalid_json');

}

/* ----- limits and validation (shared with Pinch share links) ----- */
const LIM = { name: 120, text: 6000, lines: 150, method: 12000, servings: 1000, tin: 200, recipes: 500, file: 2 * 1024 * 1024, link: 12000, inflated: 64 * 1024 };
const SHARE_PREFIX = '#share=';
const cleanText = s => String(s).replace(/\r\n?/g, '\n').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F​-‏‪-‮⁦-⁩]/g, '');
const keyOf = r => String(r.name).trim().toLowerCase() + '|' + r.serves;
const newId = () => 'u-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const guessCat = n => /cake|cookie|bread|muffin|brownie|scone|biscuit|pastry|tart|bake/i.test(n) ? 'Baking' : /tea|chai|coffee|smoothie|juice|latte/i.test(n) ? 'Drinks' : /curry|rice|biryani|dal|dhal/i.test(n) ? 'Curry & rice' : /pasta|lasagne|spaghetti|pizza/i.test(n) ? 'Pasta & bakes' : 'Mains';

/* Pinch-style recipe: { name, servings, text, method, tin:{shape,a,b,unit} } */
function validatePinch(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return { error: 'That is not a recipe.' };
  if (raw.name != null && typeof raw.name !== 'string') return { error: 'The recipe name must be text.' };
  const name = cleanText(raw.name || '').replace(/\s+/g, ' ').trim() || 'Untitled recipe';
  if (name.length > LIM.name) return { error: 'The recipe name is too long (max ' + LIM.name + ' characters).' };
  const servings = typeof raw.servings === 'string' && raw.servings.trim() ? Number(raw.servings) : raw.servings;
  if (typeof servings !== 'number' || !isFinite(servings) || servings <= 0 || servings > LIM.servings) return { error: 'Servings must be a number between 0 and ' + LIM.servings + '.' };
  if (typeof raw.text !== 'string') return { error: 'Add some ingredients first.' };
  const text = cleanText(raw.text).trim();
  if (!text) return { error: 'Add some ingredients first.' };
  if (text.length > LIM.text) return { error: 'The ingredient list is too long (max ' + LIM.text + ' characters).' };
  if (text.split('\n').filter(l => l.trim()).length > LIM.lines) return { error: 'Too many ingredient lines (max ' + LIM.lines + ').' };
  if (raw.method != null && typeof raw.method !== 'string') return { error: 'The method must be text.' };
  const method = cleanText(raw.method || '').trim();
  if (method.length > LIM.method) return { error: 'The method is too long (max ' + LIM.method + ' characters).' };
  let tin = null; const t = raw.tin;
  if (t && typeof t === 'object' && ['round', 'square', 'rect'].includes(t.shape) && ['cm', 'in'].includes(t.unit)) {
    const a = Number(t.a), b = t.shape === 'rect' ? Number(t.b) : Number(t.a);
    if (a > 0 && a <= LIM.tin && b > 0 && b <= LIM.tin) tin = { shape: t.shape, a: +a.toFixed(2), b: +b.toFixed(2), unit: t.unit };
  }
  return { recipe: { name, servings: +servings.toFixed(2), text, method, tin } };
}
function fromPinch(p) {
  const ing = [];
  for (const line of p.text.split('\n')) { const t = line.trim(); if (!t || /:$/.test(t)) continue; const row = parseLine(t); if (row) ing.push(row); }
  if (!ing.length) return null;
  const steps = (p.method || '').split('\n').map(s => s.trim()).filter(Boolean);
  const rec = { id: newId(), name: p.name, cat: guessCat(p.name), time: '', serves: p.servings, skills: [], video: 'how to make ' + p.name, ing, steps: steps.length ? steps : ['Add your method here later.'], tip: '' };
  if (p.tin) rec.pan = { shape: p.tin.shape, a: +toCm(p.tin.a, p.tin.unit).toFixed(1), b: +toCm(p.tin.b, p.tin.unit).toFixed(1), label: tinLabelT(p.tin) + ' tin' };
  return rec;
}
const ingText = ing => ing.map(([q, u, n]) => q == null ? String(n) : trim(q, 3) + (u ? ' ' + u : '') + ' ' + n).join('\n');
function toPinch(r, base) {
  const tin = base && base.pan ? { shape: base.pan.shape, a: base.pan.a, b: base.pan.b || base.pan.a, unit: 'cm' } : null;
  return { name: r.name, servings: r.serves, text: ingText(r.ing), method: r.steps.join('\n'), tin };
}

/* ----- migrate recipes saved in the old Pinch app (same site, same browser) ----- */
function migratePinch() {
  if (S.migrated) return;
  S.migrated = true;
  let old = null; try { old = JSON.parse(localStorage.getItem('pinch:v2')); } catch (e) {}
  if (old && Array.isArray(old.recipes)) {
    const seen = new Set(S.custom.map(keyOf)); let n = 0;
    for (const p of old.recipes.slice(0, LIM.recipes)) {
      const v = validatePinch(p); if (v.error) continue;
      const rec = fromPinch(v.recipe); if (!rec || seen.has(keyOf(rec))) continue;
      rec.fromPinch = true; S.custom.push(rec); seen.add(keyOf(rec)); n++;
    }
    if (n) setTimeout(() => toast('Brought ' + n + ' recipe' + (n === 1 ? '' : 's') + ' across from Pinch'), 800);
  }
  save();
}

/* ----- share links (same format as Pinch, so old links still open) ----- */
const canCompress = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';

function fromB64url(str) {

  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}
async function deflate(bytes) {

}
async function inflate(bytes, limit) {

  for (;;) {
    const { done, value } = await reader.read(); if (done) break;
    total += value.length; if (total > limit) { reader.cancel().catch(() => {}); throw new Error('too large'); }
    chunks.push(value);
  }
  const out = new Uint8Array(total); let off = 0; for (const c of chunks) { out.set(c, off); off += c.length; } return out;
}
async function encodeRecipe(r) {
  const t = r.tin, json = JSON.stringify({ v: 1, n: r.name, s: r.servings, i: r.text, m: r.method, t: t ? [t.shape, t.a, t.b, t.unit] : null });

  return canCompress ? 'z' + toB64url(await deflate(bytes)) : 'p' + toB64url(bytes);
}

  if (payload.length > LIM.link) throw new Error('This link is too long to be a recipe.');

  if (kind === 'z') { if (!canCompress) throw new Error('This browser cannot open compressed links. Try a newer browser.'); bytes = await inflate(data, LIM.inflated); }

  if (!obj || obj.v !== 1) throw new Error('unsupported version');
  const t = Array.isArray(obj.t) ? { shape: obj.t[0], a: obj.t[1], b: obj.t[2], unit: obj.t[3] } : null;
  const v = validatePinch({ name: obj.n, servings: obj.s, text: obj.i, method: obj.m, tin: t });
  if (v.error) throw new Error(v.error); return v.recipe;
}
async function shareCurrent() {
  const base = find(ui.openId), r = cur(); if (!base || !r) return;
  const v = validatePinch(toPinch(Object.assign({}, r, { name: r.name + (ui.version === 'vegan' && base.vegan ? ' (vegan)' : '') }), base));
  if (v.error) return toast(v.error, 3500);
  let payload; try { payload = await encodeRecipe(v.recipe); } catch (e) { return toast('Could not build a link for this recipe.', 3500); }
  if (payload.length > LIM.link) return toast('This recipe is too long for a link. Use Export in Settings instead.', 4500);
  const url = location.href.split('#')[0] + SHARE_PREFIX + payload;
  showDialog((body, close) => {
    const h = mk('h3', '', 'Share “' + v.recipe.name + '”');
    const box = mk('input', ''); box.type = 'text'; box.readOnly = true; box.value = url; box.setAttribute('aria-label', 'Share link'); box.addEventListener('focus', () => box.select());
    const acts = mk('div', 'dlg-actions');
    const copyBtn = dlgBtn('Copy link', 'primary', async () => { await copyAny(url); copyBtn.textContent = 'Copied ✓'; setTimeout(() => { copyBtn.textContent = 'Copy link'; }, 2000); });
    acts.append(copyBtn);
    if (navigator.share) acts.append(dlgBtn('Share…', '', () => navigator.share({ title: v.recipe.name, url }).catch(() => {})));
    acts.append(dlgBtn('Close', '', close));

function showIncoming(res) {
  showDialog((body, close) => {
    body.append(mk('h3', '', res.error ? 'Couldn’t open this link' : 'Recipe shared with you'));
    const acts = mk('div', 'dlg-actions');

    const r = res.recipe;
    body.append(mk('p', 'muted small', r.name + ' · serves ' + trim(r.servings, 2) + (r.tin ? ' · ' + tinLabelT(r.tin) + ' tin' : '')), mk('pre', '', r.text));
    if (r.method) body.append(mk('pre', '', r.method));

function saveIncoming(p) {
  const rec = fromPinch(p); if (!rec) return toast('That recipe has no ingredients I can read.');
  const dup = S.custom.find(x => keyOf(x) === keyOf(rec));
  if (dup) { toast('That recipe is already saved'); return openRecipe(dup.id); }
  if (S.custom.length >= LIM.recipes) return toast('Your library is full (' + LIM.recipes + ' recipes). Delete some first.', 3500);

}
async function handleHash() {
  if (!location.hash.startsWith(SHARE_PREFIX)) return;
  const payload = location.hash.slice(SHARE_PREFIX.length);
  try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) {}
  let res;
  try { res = { recipe: await decodeRecipe(payload) }; }
  catch (e) { res = { error: /^(This|That|Servings|The |Add |Too )/.test(e.message) ? e.message : 'This link looks damaged or is not a recipe link.' }; }
  showIncoming(res);

/* ----- backup: export and import ----- */
function exportAll() {
  const data = { app: 'scale-and-simmer', version: 1, exported: new Date().toISOString(), custom: S.custom, prices: S.prices, pantry: S.pantry };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = 'scale-and-simmer-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Exported ' + S.custom.length + ' recipe' + (S.custom.length === 1 ? '' : 's'));
}
function cleanIngArr(a) {
  return (Array.isArray(a) ? a : []).slice(0, LIM.lines).map(i => {
    if (!Array.isArray(i)) return null;
    const q = i[0] == null ? null : Number(i[0]);
    if (q != null && !(q > 0 && q < 1e6)) return null;
    const u = typeof i[1] === 'string' && hasOwn(UNITS, i[1]) ? i[1] : '';
    const n = cleanText(i[2] == null ? '' : i[2]).trim().slice(0, 100);
    return n ? [q, q == null ? '' : u, n] : null;
  }).filter(Boolean);
}
function cleanOwn(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const name = cleanText(raw.name || '').trim().slice(0, LIM.name), serves = Number(raw.serves);
  if (!name || !(serves > 0 && serves <= LIM.servings)) return null;
  const ing = cleanIngArr(raw.ing); if (!ing.length) return null;
  const steps = (Array.isArray(raw.steps) ? raw.steps : []).map(s => cleanText(s).trim().slice(0, 2000)).filter(Boolean).slice(0, 60);
  const rec = { id: newId(), name, cat: CATS.includes(raw.cat) ? raw.cat : 'Mains', time: cleanText(raw.time || '').slice(0, 20), serves, skills: [], video: 'how to make ' + name, ing, steps: steps.length ? steps : ['Add your method here later.'], tip: cleanText(raw.tip || '').slice(0, 600) };
  if (raw.ai) rec.ai = true;
  if (raw.vegan && typeof raw.vegan === 'object') {
    const vi = cleanIngArr(raw.vegan.ing), vs = (Array.isArray(raw.vegan.steps) ? raw.vegan.steps : []).map(s => cleanText(s).trim().slice(0, 2000)).filter(Boolean).slice(0, 60);
    if (vi.length && vs.length) rec.vegan = { ing: vi, steps: vs, tip: cleanText(raw.vegan.tip || '').slice(0, 600) };
  }
  const p = raw.pan;
  if (p && ['round', 'square', 'rect'].includes(p.shape) && Number(p.a) > 0 && Number(p.a) <= LIM.tin) rec.pan = { shape: p.shape, a: Number(p.a), b: Number(p.b) > 0 ? Number(p.b) : Number(p.a), label: cleanText(p.label || 'tin').slice(0, 60) };
  return rec;
}
async function importFile(file) {
  if (file.size > LIM.file) return toast('That file is too big (max 2 MB).', 3500);
  let data; try { data = JSON.parse(await file.text()); } catch (e) { return toast('That file is not valid JSON.', 3500); }
  const own = data && data.app === 'scale-and-simmer', pinch = data && data.app === 'pinch';
  const list = own ? data.custom : (Array.isArray(data) ? data : data && Array.isArray(data.recipes) ? data.recipes : null);
  if (!Array.isArray(list)) return toast('No recipes found in that file.', 3500);
  const seen = new Set(S.custom.map(keyOf)); let added = 0, dupes = 0, bad = 0, full = 0;
  for (const raw of list.slice(0, LIM.recipes)) {
    let rec = null;
    if (own) rec = cleanOwn(raw); else { const v = validatePinch(raw); rec = v.error ? null : fromPinch(v.recipe); }
    if (!rec) { bad++; continue; }
    if (seen.has(keyOf(rec))) { dupes++; continue; }
    if (S.custom.length >= LIM.recipes) { full++; continue; }
    S.custom.push(rec); seen.add(keyOf(rec)); added++;
  }
  if (own) {
    if (data.prices && typeof data.prices === 'object') for (const k of Object.keys(data.prices).slice(0, 2000)) { const p = data.prices[k]; if (!S.prices[k] && p && Number(p.p) > 0 && Number(p.p) < 1000 && ['each', 'kg', 'l'].includes(p.per)) S.prices[k] = { p: Number(p.p), per: p.per }; }
    if (Array.isArray(data.pantry)) for (const p of data.pantry.slice(0, 200)) { const t = cleanText(p).trim().toLowerCase().slice(0, 40); if (t && !S.pantry.includes(t)) S.pantry.push(t); }
  }
  save(); paint(); if (ui.tab === 'settings') renderSettings();
  const bits = ['Imported ' + added + ' recipe' + (added === 1 ? '' : 's')];
  if (dupes) bits.push(dupes + ' already here'); if (bad) bits.push(bad + ' skipped as invalid'); if (full) bits.push(full + ' skipped, library full');
  toast(bits.join(' · '), 5000);
}

      <label class="switch"><input type="checkbox" data-ck="auto" ${cook.auto ? 'checked' : ''}>Read each step automatically</label></div>` : ''}
    <div class="cook-nav">
      <button class="btn" type="button" data-ck="prev" ${cook.i === 0 ? 'disabled' : ''}>← Back</button>
      ${done ? '<button class="btn primary" type="button" data-ck="close">Finish</button>' : `<button class="btn primary" type="button" data-ck="next">${cook.i === n - 1 ? 'Finish' : 'Next →'}</button>`}
    </div>
  </div>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-ck]'); if (!t) return;
  const d = t.dataset;
  switch (d.ck) {
    case 'close': return closeCook();
    case 'ing': cook.ing = !cook.ing; return renderCook();
    case 'next': return goStep(1);
    case 'prev': return goStep(-1);
    case 'timer': return addTimer(+d.s, d.l);
    case 'tm-x': cook.timers = cook.timers.filter(x => x.id !== d.id); return renderCook();
    case 'read': if (cook.speaking) { stopSpeak(); return renderCook(); } speak(cook.r.steps[cook.i]); return renderCook();
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.ck === 'auto') {
    cook.auto = e.target.checked;
    if (cook.auto && cook.i < cook.r.steps.length) { speak(cook.r.steps[cook.i]); renderCook(); }
  }
});
document.addEventListener('keydown', e => {
  if (!cook.on) return;
  if (e.key === 'ArrowRight') goStep(1); else if (e.key === 'ArrowLeft') goStep(-1); else if (e.key === 'Escape') closeCook();
});
/* ---------- Plan: week, shopping list, total cost ---------- */
const planEntries = () => S.plan.filter(m => find(m.id));
const planRows = () => buildList(planEntries().map(m => ({ id: m.id, ver: m.ver, n: m.n })));
const planPortions = () => planEntries().reduce((a, m) => a + m.n, 0);
ui.pf = null; ui.pn = 4; ui.confirmClear = false; ui.estBusy = false;

function renderPlan() {
  const list = all(), v = $('#v-plan');
  if (!ui.pf || !find(ui.pf.id)) { const f = list[0]; ui.pf = { id: f ? f.id : '', ver: 'original', n: f ? f.serves : 4, day: 'Mon' }; }
  const pf = ui.pf, sel = find(pf.id), entries = planEntries();
  const rows = planRows(), buy = rows.filter(r => r.dim !== 'taste'), taste = rows.filter(r => r.dim === 'taste');
  const byDay = DAYS.map(d => [d, entries.filter(m => m.day === d)]).filter(([, a]) => a.length);
  v.innerHTML = `<div class="stack">
    <div><span class="eyebrow">Meal planner</span><h2>Plan the week</h2></div>
    <p class="muted">Pick meals and how many people each is for. You get one shopping list with matching items added together, and a total cost.</p>
    ${list.length ? `<div class="stack day">
      <label class="f">Recipe<select class="pf" id="pf-id">${list.map(r => `<option value="${esc(r.id)}" ${r.id === pf.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></label>
      <div class="row">
        <label class="f grow">Version<select class="pf" id="pf-ver"><option value="original">Original</option>${sel && sel.vegan ? `<option value="vegan" ${pf.ver === 'vegan' ? 'selected' : ''}>Vegan</option>` : ''}</select></label>
        <label class="f grow">People<input class="pf" id="pf-n" type="number" inputmode="numeric" min="1" max="500" value="${pf.n}"></label>
        <label class="f grow">Day<select class="pf" id="pf-day">${DAYS.map(d => `<option ${pf.day === d ? 'selected' : ''}>${d}</option>`).join('')}</select></label>
      </div>
      <button class="btn primary" type="button" data-x="plan-add">Add to plan</button>
    </div>` : '<div class="empty">Add a recipe first.</div>'}
    ${byDay.length ? byDay.map(([d, ms]) => `<div class="day"><strong>${d}</strong>${ms.map(m => { const r = find(m.id); return `<div class="meal"><div>${esc(r.name)}${m.ver === 'vegan' ? ' <span class="tag">Vegan</span>' : ''}</div><input type="number" inputmode="numeric" min="1" max="500" class="mn" data-u="${m.uid}" value="${m.n}" aria-label="People for ${esc(r.name)}"><button type="button" class="x btn" data-x="plan-rm" data-u="${m.uid}" aria-label="Remove ${esc(r.name)}">×</button></div>`; }).join('')}</div>`).join('')
      : '<div class="empty"><p>Nothing planned yet. Add a meal above, or use “Add to plan” on any recipe.</p></div>'}
    ${entries.length ? `<h3>Shopping list</h3>
      <div class="day" style="gap:0">${buy.map(row => `<label class="check ${S.checked[row.id] ? 'got' : ''}"><input type="checkbox" class="ckb" data-r="${esc(row.id)}" ${S.checked[row.id] ? 'checked' : ''}><span class="cn">${esc(rowLabel(row))}</span><span class="cq">${esc(rowText(row))}</span></label>`).join('')}</div>
      ${taste.length ? `<p class="small muted"><strong>Check your cupboard:</strong> ${esc(taste.map(r => r.name).join(', '))}</p>` : ''}
      <div class="row"><button class="btn" type="button" data-x="plan-copy">Copy the list</button><button class="btn" type="button" data-x="plan-unck">Untick all</button></div>
      <details class="x" data-k="pcost" ${ui.open.pcost ? 'open' : ''}><summary>What it costs</summary><div class="xb">${costBlock(rows, planPortions(), 'p')}</div></details>
      <div class="row">${ui.confirmClear ? '<span class="err">Clear the whole plan?</span><button class="btn danger" type="button" data-x="plan-clear-yes">Yes, clear</button><button class="btn" type="button" data-x="plan-clear-no">Keep it</button>' : '<button class="btn danger" type="button" data-x="plan-clear">Clear the plan</button>'}</div>` : ''}
  </div>`;
}
function listText() {
  const rows = planRows().filter(r => r.dim !== 'taste');
  return 'Shopping list\n' + rows.map(r => '- ' + rowText(r) + ' ' + rowLabel(r)).join('\n');
}
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-x]'); if (!t) return;
  const d = t.dataset;
  switch (d.x) {
    case 'plan-add': {
      const pf = ui.pf, r = find(pf.id); if (!r) return;
      S.plan = [...S.plan, { uid: uid(), id: pf.id, ver: pf.ver === 'vegan' && r.vegan ? 'vegan' : 'original', n: Math.max(1, Math.min(500, Math.round(+pf.n || r.serves))), day: pf.day }];
      save(); toast('Added to ' + pf.day); return renderPlan();
    }
    case 'plan-rm': S.plan = S.plan.filter(m => m.uid !== d.u); save(); return renderPlan();
    case 'plan-unck': S.checked = {}; save(); return renderPlan();
    case 'plan-clear': ui.confirmClear = true; return renderPlan();
    case 'plan-clear-no': ui.confirmClear = false; return renderPlan();
    case 'plan-clear-yes': S.plan = []; S.checked = {}; ui.confirmClear = false; save(); return renderPlan();
    case 'plan-copy': {
      const txt = listText();
      if (await copyText(txt)) return toast('List copied');
      const box = document.createElement('textarea'); box.value = txt; box.rows = 8; box.setAttribute('aria-label', 'Shopping list'); t.after(box); box.select(); return toast('Press and hold the text to copy it');
    }
    case 'pantry-rm': S.pantry = S.pantry.filter((_, i) => i !== +d.i); save(); return renderPantry();
    case 'pantry-clear': S.pantry = []; save(); return renderPantry();
    case 'pantry-add': return addPantry();
    case 'pcook': {
      openRecipe(d.id); ui.version = d.ver; ui.servings = Math.max(1, ui.pn); paint(); return;
    }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.classList.contains('pf')) {
    const pf = ui.pf;
    if (el.id === 'pf-id') { pf.id = el.value; const r = find(pf.id); pf.n = r ? r.serves : pf.n; pf.ver = 'original'; return renderPlan(); }
    if (el.id === 'pf-ver') pf.ver = el.value;
    if (el.id === 'pf-n') pf.n = Math.max(1, Math.min(500, Math.round(+el.value || 1)));
    if (el.id === 'pf-day') pf.day = el.value;
  } else if (el.classList.contains('mn')) {
    const m = S.plan.find(x => x.uid === el.dataset.u); if (m) { m.n = Math.max(1, Math.min(500, Math.round(+el.value || 1))); save(); renderPlan(); }
  } else if (el.classList.contains('ckb')) {
    if (el.checked) S.checked[el.dataset.r] = true; else delete S.checked[el.dataset.r];
    save(); el.closest('.check').classList.toggle('got', el.checked);
  } else if (el.id === 'po-vegan') { S.popts.vegan = el.checked; save(); renderPantry(); }
  else if (el.id === 'po-staples') { S.popts.staples = el.checked; save(); renderPantry(); }
});

/* ---------- Pantry: what can I cook? ---------- */
const sing = t => t.endsWith('ies') ? t.slice(0, -3) + 'y' : t.endsWith('oes') ? t.slice(0, -2) : t.endsWith('s') && !t.endsWith('ss') ? t.slice(0, -1) : t;
const STAPLE = /^(salt|water|black pepper|(olive |vegetable |cooking |sunflower |rapeseed )?oil)\b/;
function haveIt(name) {
  const k = ikey(name);
  return S.pantry.some(p => { const s = sing(p.toLowerCase().trim()); return s.length >= 3 && (k.includes(s) || (k.length >= 3 && s.includes(k))); });
}
function pantryMatches() {
  const out = [];
  for (const r0 of all()) {
    const ver = S.popts.vegan ? 'vegan' : 'original';
    if (ver === 'vegan' && !r0.vegan) continue;
    const r = variantOf(r0, ver), need = [], have = [], miss = [];
    for (const it of r.ing) {
      const [q, , name] = it;
      if (q == null) continue;
      if (haveIt(name)) have.push(name); else if (S.popts.staples && STAPLE.test(ikey(name))) have.push(name); else miss.push(shortName(name));
      need.push(name);
    }
    const hits = have.length;
    if (!need.length || !S.pantry.length || hits === 0 || (S.popts.staples && have.every(h => STAPLE.test(ikey(h))))) continue;
    out.push({ r: r0, ver, total: need.length, have: hits, miss });
  }
  return out.sort((a, b) => (b.have / b.total) - (a.have / a.total) || a.miss.length - b.miss.length).slice(0, 12);
}
function renderPantry() {
  const res = S.pantry.length ? pantryMatches() : [];
  $('#v-pantry').innerHTML = `<div class="stack">
    <div><span class="eyebrow">Fridge and cupboard</span><h2>What can I cook?</h2></div>
    <p class="muted">Add what you have. You get recipes ranked by how much of them you already own.</p>
    <form class="row" id="pform" novalidate>
      <input type="text" id="p-in" class="grow" placeholder="e.g. eggs, onion, rice" aria-label="Add an ingredient you have" autocomplete="off">
      <button class="btn primary" type="submit">Add</button>
    </form>
    ${S.pantry.length ? `<div class="pantry-chips">${S.pantry.map((p, i) => `<button type="button" class="chip rm" data-x="pantry-rm" data-i="${i}" aria-label="Remove ${esc(p)}">${esc(p)}</button>`).join('')}</div>
      <div class="row between"><div class="row"><label class="switch"><input type="checkbox" id="po-vegan" ${S.popts.vegan ? 'checked' : ''}>Vegan only</label>
      <label class="switch"><input type="checkbox" id="po-staples" ${S.popts.staples ? 'checked' : ''}>I have salt, pepper, oil and water</label></div>
      <button class="btn ghost" type="button" data-x="pantry-clear">Clear</button></div>
      <label class="f">Cooking for how many?<input type="number" id="pn" inputmode="numeric" min="1" max="100" value="${ui.pn}"></label>` : ''}
    ${S.pantry.length ? (res.length ? res.map(m => `<div class="card" style="gap:8px">
        <div class="row between"><h3>${esc(m.r.name)}</h3><span class="tag">${m.have} of ${m.total}</span></div>
        <div class="small ${m.miss.length ? '' : 'muted'}">${m.miss.length ? 'Still needed: ' + esc(m.miss.join(', ')) : 'You have everything.'}</div>
        <div class="row"><button class="btn primary" type="button" data-x="pcook" data-id="${esc(m.r.id)}" data-ver="${m.ver}">Cook for ${ui.pn}</button></div>
      </div>`).join('') : '<div class="empty"><p>No recipe uses those yet. Try adding more, like onion, rice or flour.</p></div>')
      : '<div class="empty"><p>Your list is empty. Type an ingredient and press Add.</p></div>'}
    ${S.pantry.length ? '<p class="hint">Matching is by name, so “milk” counts for any milk. Check swaps and what is still needed before you start.</p>' : ''}
  </div>`;
}
function addPantry() {
  const el = $('#p-in'); if (!el) return;
  const items = el.value.split(/[,\n]+/).map(s => s.trim().toLowerCase()).filter(s => s.length > 1);
  if (!items.length) return;
  for (const it of items) if (!S.pantry.includes(it)) S.pantry.push(it);
  save(); renderPantry(); const n = $('#p-in'); if (n) n.focus();
}
document.addEventListener('submit', e => { if (e.target.id === 'pform') addPantry(); });
/* ---------- Search home: predictive dropdown ---------- */
function suggestions(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const out = [];
  for (const r of all()) {
    const n = r.name.toLowerCase(); let s = 0, via = '';
    if (n.startsWith(q)) s = 4;
    else if (n.split(/[^a-z0-9]+/).some(w => w.startsWith(q))) s = 3;
    else if (n.includes(q)) s = 2;
    else {
      const hit = r.ing.find(i => String(i[2]).toLowerCase().includes(q));
      if (hit) { s = 1; via = shortName(hit[2]); } else if (r.cat.toLowerCase().includes(q)) s = 1;
    }
    if (s) out.push({ r, s, via });
  }
  return out.sort((a, b) => b.s - a.s || a.r.name.localeCompare(b.r.name));
}
function hl(name, q) {
  const i = name.toLowerCase().indexOf(q.trim().toLowerCase());
  if (i < 0 || !q.trim()) return esc(name);
  const L = q.trim().length;
  return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + L)) + '</mark>' + esc(name.slice(i + L));
}
function paintSugg() {
  const el = $('#sugg'), inp = $('#q'); if (!el || !inp) return;
  const q = ui.q.trim();
  if (!q) { el.hidden = true; inp.setAttribute('aria-expanded', 'false'); return; }
  const list = suggestions(q);
  el.innerHTML = list.slice(0, 8).map(m => `<button type="button" class="sg" role="option" data-open="${esc(m.r.id)}"><span class="sgn">${hl(m.r.name, q)}</span><span class="sgm">${esc(m.r.cat)}${m.r.time ? ' · ' + esc(m.r.time) : ''}${m.via ? ' · has ' + esc(m.via) : ''}${m.r.vegan ? ' · vegan version' : ''}</span></button>`).join('')
    + (list.length > 8 ? `<button type="button" class="sg all" data-act="search-all">See all ${list.length} results</button>` : '')
    + (!list.length ? `<div class="sg none">No recipe matches “${esc(q)}”.</div>` : '')
    + (!list.length && SAMPLE ? `<button type="button" class="sg all" data-act="ask-dish">Ask AI for a ${esc(q)} recipe</button>` : '');
  el.hidden = false; inp.setAttribute('aria-expanded', 'true');
}
function sgItems() { return $$('#sugg .sg[data-open], #sugg .sg.all'); }
function sgMark() { sgItems().forEach((b, i) => b.classList.toggle('on', i === ui.sg)); const b = sgItems()[ui.sg]; if (b) b.scrollIntoView({ block: 'nearest' }); }
function applySearch() { ui.fq = ui.q; renderLibrary(); }
document.addEventListener('keydown', e => {
  if (!e.target || e.target.id !== 'q') return;
  const items = sgItems();
  if (e.key === 'ArrowDown' && items.length) { e.preventDefault(); ui.sg = (ui.sg + 1) % items.length; sgMark(); }
  else if (e.key === 'ArrowUp' && items.length) { e.preventDefault(); ui.sg = (ui.sg - 1 + items.length) % items.length; sgMark(); }
  else if (e.key === 'Escape') { $('#sugg').hidden = true; }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (items[ui.sg]) items[ui.sg].click();
    else if (suggestions(ui.q).length === 1) items[0].click();
    else applySearch();
  }
});
document.addEventListener('focusin', e => { if (e.target && e.target.id === 'q' && ui.q.trim()) paintSugg(); });
document.addEventListener('click', e => {
  const sg = $('#sugg'); if (!sg) return;
  const t = e.target;
  if (t.closest && t.closest('.sugg [data-open]')) { ui.q = ''; ui.fq = ''; ui.sg = -1; sg.hidden = true; return; }
  const a = t.closest && t.closest('[data-act]');
  if (a && a.dataset.act === 'search-all') return applySearch();
  if (a && a.dataset.act === 'search-clear') { ui.q = ''; ui.fq = ''; return renderLibrary(); }
  if (!(t.closest && t.closest('.search'))) sg.hidden = true;
});
applyTheme();
paint();
initStore();
initSample();
handleHash();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
